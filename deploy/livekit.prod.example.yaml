# LiveKit production config. Copy to livekit.prod.yaml and fill in.
port: 7880
bind_addresses: ["127.0.0.1"] # signalling is reached through Caddy only
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true # discover the public IP via STUN (cloud VMs behind 1:1 NAT)
room:
  empty_timeout: 300
  departure_timeout: 20
keys:
  # Must match LIVEKIT_API_KEY / LIVEKIT_API_SECRET in .env.production. Secret ≥ 32 random chars.
  REPLACE_KEY: REPLACE_WITH_LONG_RANDOM_SECRET
webhook:
  api_key: REPLACE_KEY
  urls:
    - http://127.0.0.1:3100/api/livekit/webhook
# Built-in TURN so users behind strict firewalls can connect (TLS on 5349 needs a cert for turn.<domain>).
turn:
  enabled: true
  domain: turn.example.com
  tls_port: 5349
  udp_port: 3478
  cert_file: /etc/livekit/turn.crt
  key_file: /etc/livekit/turn.key
logging:
  level: info
