# LiveKit server config. API key/secret must match LIVEKIT_API_KEY / LIVEKIT_API_SECRET in .env.
port: 7880                       # HTTP + WebSocket signalling (proxied as wss:// by Caddy)
bind_addresses: ["0.0.0.0"]
rtc:
  tcp_port: 7881                 # ICE/TCP fallback when UDP is blocked
  port_range_start: 50000        # UDP media ports — must be reachable from browsers
  port_range_end: 50200
  use_external_ip: false
  node_ip: YOUR_SERVER_LAN_IP                    # IP address browsers use to reach this host
room:
  empty_timeout: 300             # close a room 5 min after everyone leaves
  departure_timeout: 20
keys:
  meetmind_dev: CHANGE_ME_at_least_32_chars_secret
webhook:
  api_key: meetmind_dev
  urls:
    - http://127.0.0.1:3100/api/livekit/webhook
logging:
  level: info
